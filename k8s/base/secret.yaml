apiVersion: v1
kind: Secret
metadata:
  name: observatory-secrets
  labels:
    app.kubernetes.io/name: observatory
type: Opaque
stringData:
  OBSERVATORY_GITLAB_TOKEN: ""
  # Token for the internal GitLab instance (gitlab.cee.redhat.com). Populate
  # only if any tracked repository lives on the internal host; used by
  # backend.git_sync.resolve_token for repo checkouts.
  OBSERVATORY_GITLAB_TOKEN_INTERNAL: ""
  OBSERVATORY_GITHUB_TOKEN: ""
  OBSERVATORY_API_KEY: ""
